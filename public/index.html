<script>
  AOS.init({ duration: 800, once: true });

  const MARKET_CONFIG = [
    { name: 'NIFTY 50',   yahoo: '^NSEI',    icon: '📊', desc: 'NSE 50',     prefix: '�' },
    { name: 'NIFTY BANK', yahoo: '^NSEBANK', icon: '🏦', desc: 'Bank Index', prefix: '₹' },
    { name: 'SENSEX',     yahoo: '^BSESN',   icon: '📈', desc: 'BSE 30',     prefix: '₹' },
    { name: 'GOLD',       yahoo: 'GC=F',     icon: '�', desc: 'MCX',        prefix: '$' },
    { name: 'SILVER',     yahoo: 'SI=F',     icon: '🥈', desc: 'MCX',        prefix: '$' },
    { name: 'CRUDE OIL',  yahoo: 'CL=F',     icon: '🛢️', desc: 'MCX',        prefix: '$' }
  ];

  let selectedSymbol = 'NIFTY 50';
  let currentData = null;

  function renderMarketCards() {
    const grid = document.getElementById('marketsGrid');
    if (!grid) return;
    grid.innerHTML = MARKET_CONFIG.map(m => 
      '<div onclick="openMarketDetail(\'' + m.name + '\')" id="mkt-' + m.yahoo + '" class="bg-black border border-zinc-800 p-5 rounded-xl text-center hover:border-emerald-400 hover:shadow-lg hover:shadow-emerald-500/20 transition cursor-pointer">' +
        '<div class="text-3xl mb-2">' + m.icon + '</div>' +
        '<div class="font-bold">' + m.name + '</div>' +
        '<div class="text-xs text-zinc-500 mt-1">' + m.desc + '</div>' +
        '<div class="text-sm text-zinc-500 mt-3 pulse-dot">Loading...</div>' +
      '</div>'
    ).join('');
  }

  function updateMarketCard(yahooSym, name, last, change, pct, icon, desc, prefix) {
    const el = document.getElementById('mkt-' + yahooSym);
    if (!el) return;
    const isUp = change >= 0;
    const color = isUp ? 'text-emerald-400' : 'text-red-400';
    const arrow = isUp ? '▲' : '▼';
    const sign = isUp ? '+' : '';
    
    el.innerHTML = 
      '<div class="text-3xl mb-2">' + icon + '</div>' +
      '<div class="font-bold">' + name + '</div>' +
      '<div class="text-xs text-zinc-500 mt-1">' + desc + '</div>' +
      '<div class="text-lg ' + color + ' font-bold mt-3">' + prefix + last.toFixed(2) + '</div>' +
      '<div class="text-xs ' + color + ' font-semibold">' + arrow + ' ' + sign + Math.abs(pct).toFixed(2) + '%</div>' +
      '<div class="text-[10px] text-zinc-600 mt-2">Click for details →</div>';
  }

  async function loadLiveData() {
    try {
      // Load Indian indices (NIFTY, BANKNIFTY, SENSEX)
      const indicesRes = await fetch('/api/indices');
      const indices = await indicesRes.json();
      
      // Update ticker
      const ticker = document.getElementById('tickerBar');
      if (ticker && Array.isArray(indices)) {
        const tickerHtml = indices.map(i => {
          const c = i.change >= 0 ? 'text-emerald-400' : 'text-red-400';
          const a = i.change >= 0 ? '▲' : '▼';
          const sign = i.change >= 0 ? '+' : '';
          return '<span class="text-zinc-400">' + i.name + ' <span class="' + c + ' font-bold">' + i.last.toFixed(2) + ' ' + a + ' ' + sign + Math.abs(i.percentChange).toFixed(2) + '%</span></span>';
        }).join('');
        ticker.innerHTML = tickerHtml + tickerHtml;
      }

      if (Array.isArray(indices)) {
        indices.forEach(idx => {
          const config = MARKET_CONFIG.find(m => m.name === idx.name);
          if (config) {
            updateMarketCard(config.yahoo, config.name, idx.last, idx.change, idx.percentChange, config.icon, config.desc, config.prefix);
          }
        });
      }

      // Load MCX (Gold, Silver, Crude) via server (no CORS!)
      try {
        const mcxRes = await fetch('/api/mcx');
        const mcxData = await mcxRes.json();
        if (Array.isArray(mcxData)) {
          mcxData.forEach(idx => {
            const config = MARKET_CONFIG.find(m => m.name === idx.name);
            if (config) {
              updateMarketCard(config.yahoo, idx.name, idx.last, idx.change, idx.percentChange, config.icon, config.desc, config.prefix);
            }
          });
        }
      } catch (err) {
        console.log('MCX fetch error:', err);
      }

      // Update NIFTY mockup
      const nifty = Array.isArray(indices) ? indices.find(i => i.name === 'NIFTY 50') : null;
      if (nifty) {
        updateMockup(nifty);
      }
    } catch (err) {
      console.error('Live data error:', err);
    }
  }

  function updateMockup(nifty) {
    const spot = nifty.last;
    const change = nifty.change;
    const pctChange = nifty.percentChange;
    const isUp = change >= 0;
    const sign = isUp ? '+' : '';
    const arrow = isUp ? '▲' : '▼';
    const color = isUp ? 'text-emerald-400' : 'text-red-400';

    document.getElementById('mockNiftySpot').textContent = spot.toFixed(2);
    document.getElementById('mockNiftySpot').className = 'text-2xl font-bold ' + color;
    document.getElementById('mockNiftyChange').textContent = arrow + ' ' + sign + Math.abs(change).toFixed(2) + ' (' + sign + Math.abs(pctChange).toFixed(2) + '%)';
    document.getElementById('mockNiftyChange').className = 'text-xs mt-1 ' + color;

    const atmStrike = Math.round(spot / 50) * 50;
    document.getElementById('mockATMStrike').textContent = atmStrike + ' CE';

    const iv = (14 + Math.random() * 2).toFixed(1);
    document.getElementById('mockATMIV').textContent = 'IV: ' + iv + '%';

    const itmStrike = atmStrike - 50;
    const otmStrike = atmStrike + 50;
    const basePrice = spot * 0.015;
    const debit = basePrice * 0.5;
    const maxProfit = 50 - debit;
    document.getElementById('mockBFPL').textContent = (maxProfit >= 0 ? '+₹' : '-�') + Math.abs(maxProfit).toFixed(0);
    document.getElementById('mockBFPL').className = 'text-2xl font-bold ' + (maxProfit >= 0 ? 'text-emerald-400' : 'text-red-400');

    const ivp = (28 + Math.random() * 7).toFixed(1);
    document.getElementById('mockIVP').textContent = ivp;

    const itmPrice = basePrice * 1.4;
    const atmPrice = basePrice;
    const otmPrice = basePrice * 0.6;
    document.getElementById('mockLegs').innerHTML = 
      '<div class="text-zinc-400">Buy <span class="text-emerald-400 font-bold">1×</span> ' + itmStrike + ' CE @ ₹' + itmPrice.toFixed(0) + '</div>' +
      '<div class="text-zinc-400">Sell <span class="text-red-400 font-bold">2×</span> ' + atmStrike + ' CE @ ₹' + atmPrice.toFixed(0) + '</div>' +
      '<div class="text-zinc-400">Buy <span class="text-emerald-400 font-bold">1×</span> ' + otmStrike + ' CE @ ₹' + otmPrice.toFixed(0) + '</div>';

    document.getElementById('mockSummary').innerHTML = 
      '<div>Net Debit: <span class="text-white font-bold">₹' + debit.toFixed(0) + '</span></div>' +
      '<div>Max Profit: <span class="' + (maxProfit >= 0 ? 'text-emerald-400' : 'text-red-400') + ' font-bold">' + (maxProfit >= 0 ? '+₹' : '-₹') + Math.abs(maxProfit).toFixed(0) + '</span></div>' +
      '<div>Breakeven: <span class="text-yellow-400 font-bold">' + (itmStrike + debit).toFixed(0) + ' / ' + (otmStrike - debit).toFixed(0) + '</span></div>';

    const now = new Date();
    document.getElementById('liveTime').textContent = 'LIVE · ' + now.toLocaleTimeString('en-IN');
  }

  // ============= MARKET DETAIL MODAL =============
  async function openMarketDetail(symbol) {
    selectedSymbol = symbol;
    const modal = document.getElementById('detailModal');
    document.getElementById('detailTitle').textContent = symbol + ' — Live Analytics';
    document.getElementById('detailBody').innerHTML = '<div class="text-center py-12"><div class="text-4xl mb-3 pulse-dot">�</div><div class="text-zinc-400">Loading live data from ' + symbol + '...</div></div>';
    modal.classList.remove('hidden');

    try {
      const res = await fetch('/api/market-detail/' + encodeURIComponent(symbol));
      const data = await res.json();
      
      if (data.error) {
        document.getElementById('detailBody').innerHTML = '<div class="text-red-400 text-center py-12">' + data.error + '</div>';
        return;
      }

      const spot = data.spot;
      const atm = data.atmStrike;
      const isUp = data.chain && data.chain.length > 0 && data.chain[0].ltp > 0;
      
      // Calculate butterfly 1:2:1 P&L
      const gap = atm - Math.round(atm * 0.98); // approximate
      const itmStrike = atm - 50;
      const otmStrike = atm + 50;
      const ce_itm = data.chain.find(o => o.strike === itmStrike && o.type === 'CE');
      const ce_atm = data.chain.find(o => o.strike === atm && o.type === 'CE');
      const ce_otm = data.chain.find(o => o.strike === otmStrike && o.type === 'CE');
      
      let bfPL = '--', debit = '--', maxProfit = '--';
      if (ce_itm && ce_atm && ce_otm) {
        debit = ce_itm.ltp - (2 * ce_atm.ltp) + ce_otm.ltp;
        maxProfit = 50 - debit;
        bfPL = (maxProfit >= 0 ? '+�' : '-₹') + Math.abs(maxProfit).toFixed(0);
      }

      // PCR calculation
      let callOI = 0, putOI = 0;
      data.chain.forEach(o => {
        if (o.type === 'CE') callOI += o.oi || 0;
        else putOI += o.oi || 0;
      });
      const pcr = callOI > 0 ? (putOI / callOI).toFixed(2) : '--';

      document.getElementById('detailBody').innerHTML = 
        '<div class="grid md:grid-cols-4 gap-4 mb-6">' +
          '<div class="bg-zinc-900 p-4 rounded-lg border border-zinc-800">' +
            '<div class="text-xs text-zinc-500 mb-1">SPOT PRICE</div>' +
            '<div class="text-2xl font-black text-emerald-400">' + spot.toFixed(2) + '</div>' +
          '</div>' +
          '<div class="bg-zinc-900 p-4 rounded-lg border border-zinc-800">' +
            '<div class="text-xs text-zinc-500 mb-1">ATM STRIKE</div>' +
            '<div class="text-2xl font-black">' + atm + '</div>' +
          '</div>' +
          '<div class="bg-zinc-900 p-4 rounded-lg border border-zinc-800">' +
            '<div class="text-xs text-zinc-500 mb-1">PCR (OI)</div>' +
            '<div class="text-2xl font-black text-cyan-400">' + pcr + '</div>' +
          '</div>' +
          '<div class="bg-zinc-900 p-4 rounded-lg border border-zinc-800">' +
            '<div class="text-xs text-zinc-500 mb-1">BUTTERFLY 1:2:1</div>' +
            '<div class="text-2xl font-black ' + (maxProfit >= 0 ? 'text-emerald-400' : 'text-red-400') + '">' + bfPL + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="bg-zinc-900 rounded-lg overflow-hidden border border-zinc-800">' +
          '<div class="p-3 bg-gradient-to-r from-emerald-500/10 to-cyan-500/10 text-sm font-bold">Live Option Chain (' + data.chain.length + ' strikes)</div>' +
          '<div class="overflow-x-auto max-h-96">' +
            '<table class="w-full text-xs font-mono">' +
              '<thead class="bg-zinc-950 sticky top-0"><tr>' +
                '<th class="p-2 text-right text-zinc-500">OI</th>' +
                '<th class="p-2 text-right text-zinc-500">Volume</th>' +
                '<th class="p-2 text-right text-zinc-500">IV%</th>' +
                '<th class="p-2 text-center bg-emerald-500/20 text-emerald-400">CALL LTP</th>' +
                '<th class="p-2 text-center bg-cyan-500/20 text-cyan-400">STRIKE</th>' +
                '<th class="p-2 text-center bg-rose-500/20 text-rose-400">PUT LTP</th>' +
                '<th class="p-2 text-right text-zinc-500">IV%</th>' +
                '<th class="p-2 text-right text-zinc-500">Volume</th>' +
                '<th class="p-2 text-right text-zinc-500">OI</th>' +
              '</tr></thead>' +
              '<tbody>' + data.chain.slice(0, 21).map(o => 
                '<tr class="border-t border-zinc-800 ' + (o.strike === atm ? 'bg-emerald-500/10' : '') + '">' +
                  '<td class="p-2 text-right text-emerald-400">--</td>' +
                  '<td class="p-2 text-right text-zinc-500">--</td>' +
                  '<td class="p-2 text-right text-yellow-400">' + (o.iv || 0).toFixed(1) + '</td>' +
                  '<td class="p-2 text-center font-bold text-emerald-400 bg-emerald-500/10">' + (o.type === 'CE' ? o.ltp.toFixed(2) : '--') + '</td>' +
                  '<td class="p-2 text-center font-bold bg-cyan-500/10">' + o.strike + '</td>' +
                  '<td class="p-2 text-center font-bold text-rose-400 bg-rose-500/10">' + (o.type === 'PE' ? o.ltp.toFixed(2) : '--') + '</td>' +
                  '<td class="p-2 text-right text-yellow-400">' + (o.iv || 0).toFixed(1) + '</td>' +
                  '<td class="p-2 text-right text-zinc-500">--</td>' +
                  '<td class="p-2 text-right text-rose-400">--</td>' +
                '</tr>'
              ).join('') + '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
        '<div class="mt-4 text-center">' +
          '<a href="/dashboard.html" target="_blank" class="inline-block px-6 py-3 bg-emerald-500/20 border border-emerald-500/40 rounded-lg text-emerald-400 text-sm font-bold hover:bg-emerald-500/30">📊 Open Full Dashboard →</a>' +
        '</div>';
    } catch (err) {
      document.getElementById('detailBody').innerHTML = '<div class="text-red-400 text-center py-12">Error: ' + err.message + '</div>';
    }
  }

  function closeDetail() {
    document.getElementById('detailModal').classList.add('hidden');
  }

  // Init
  renderMarketCards();
  loadLiveData();
  setInterval(loadLiveData, 30000);
</script>

<!-- MARKET DETAIL MODAL -->
<div id="detailModal" class="hidden fixed inset-0 z-[100] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
  <div class="bg-zinc-950 glow-border rounded-2xl p-6 max-w-5xl w-full my-8">
    <div class="flex justify-between items-center mb-4 pb-3 border-b border-zinc-800">
      <h3 id="detailTitle" class="text-xl font-bold text-emerald-400">Market Details</h3>
      <button onclick="closeDetail()" class="text-zinc-500 hover:text-white text-3xl leading-none">×</button>
    </div>
    <div id="detailBody">
      <div class="text-center py-12 text-zinc-500">Click any market card to see live details</div>
    </div>
  </div>
</div>
