<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpreadIQ — Live Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Montserrat', sans-serif; }
  body { background: #000; color: #fff; margin: 0; }
  .glass { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); }
  .glass:hover { background: rgba(255,255,255,0.06); }
  .up { color: #22c55e; }
  .down { color: #ef4444; }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .ticker { animation: ticker 30s linear infinite; }
  @keyframes ticker { 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 3px; }
  .oi-bar { height: 3px; border-radius: 2px; transition: width 0.5s; }
  .flash-up { animation: flashGreen 1s; }
  .flash-down { animation: flashRed 1s; }
  @keyframes flashGreen { 0%{background:rgba(34,197,94,0.2)} 100%{background:transparent} }
  @keyframes flashRed { 0%{background:rgba(239,68,68,0.2)} 100%{background:transparent} }
</style>
</head>
<body class="overflow-x-hidden">

<header class="sticky top-0 z-50 bg-black/90 backdrop-blur border-b border-zinc-900">
  <div class="max-w-[1600px] mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-3">
    <a href="/" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-400 to-cyan-400 flex items-center justify-center text-black font-black text-sm">S</div>
      <span class="text-lg font-extrabold tracking-tight">Spread<span class="bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">IQ</span></span>
    </a>
    <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-zinc-400">
      <a href="/" class="hover:text-emerald-400 transition">Home</a>
      <a href="/dashboard.html" class="text-emerald-400">Dashboard</a>
      <a href="/strategy.html" class="hover:text-emerald-400 transition">Strategy Builder</a>
    </nav>
    <div class="flex items-center gap-3">
      <span id="dataBadge" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-zinc-500/10 border border-zinc-500/30">
        <span class="w-1.5 h-1.5 bg-zinc-400 rounded-full"></span>
        <span class="text-zinc-400 text-xs font-bold">LOADING</span>
      </span>
      <span id="clock" class="text-xs text-zinc-500 font-mono"></span>
    </div>
  </div>
</header>

<div class="bg-zinc-950 border-b border-zinc-900 overflow-hidden">
  <div id="ticker" class="ticker flex gap-8 py-2.5 text-xs whitespace-nowrap font-medium px-4"></div>
</div>

<section class="max-w-[1600px] mx-auto px-4 py-6">
  <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold mb-1">Option Chain — <span id="symbolName" class="text-emerald-400">NIFTY</span></h1>
      <p class="text-xs text-zinc-500">Live updates · Auto-refresh every 5s</p>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="switchSymbol('NIFTY')" id="tab-NIFTY" class="px-4 py-2 rounded-lg text-sm font-bold bg-emerald-500 text-black">NIFTY</button>
      <button onclick="switchSymbol('BANKNIFTY')" id="tab-BANKNIFTY" class="px-4 py-2 rounded-lg text-sm font-bold bg-zinc-900 text-zinc-300 hover:bg-zinc-800">BANKNIFTY</button>
      <button onclick="switchSymbol('FINNIFTY')" id="tab-FINNIFTY" class="px-4 py-2 rounded-lg text-sm font-bold bg-zinc-900 text-zinc-300 hover:bg-zinc-800">FINNIFTY</button>
    </div>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
    <div class="glass rounded-xl p-4">
      <div class="text-xs text-zinc-500 mb-1">SPOT PRICE</div>
      <div id="spotPrice" class="text-2xl font-bold text-emerald-400">--</div>
      <div id="spotChange" class="text-xs mt-1">--</div>
    </div>
    <div class="glass rounded-xl p-4">
      <div class="text-xs text-zinc-500 mb-1">ATM STRIKE</div>
      <div id="atmStrike" class="text-2xl font-bold">--</div>
      <div id="atmIV" class="text-xs text-cyan-400 mt-1">IV: --</div>
    </div>
    <div class="glass rounded-xl p-4">
      <div class="text-xs text-zinc-500 mb-1">PCR</div>
      <div id="pcrValue" class="text-2xl font-bold text-cyan-400">--</div>
      <div class="text-xs text-zinc-500 mt-1">Put/Call Ratio</div>
    </div>
    <div class="glass rounded-xl p-4">
      <div class="text-xs text-zinc-500 mb-1">MAX PAIN</div>
      <div id="maxPain" class="text-2xl font-bold text-yellow-400">--</div>
      <div class="text-xs text-zinc-500 mt-1">Highest OI strike</div>
    </div>
  </div>

  <div class="glass rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-xs">
        <thead>
          <tr class="bg-zinc-900/80 text-zinc-400">
            <th class="p-3 text-right font-semibold">Call OI</th>
            <th class="p-3 text-right font-semibold">Call Chg%</th>
            <th class="p-3 text-center font-semibold text-emerald-400">Call LTP</th>
            <th class="p-3 text-center font-bold bg-zinc-800 text-white">STRIKE</th>
            <th class="p-3 text-center font-semibold text-rose-400">Put LTP</th>
            <th class="p-3 text-left font-semibold">Put Chg%</th>
            <th class="p-3 text-left font-semibold">Put OI</th>
          </tr>
        </thead>
        <tbody id="chainBody"></tbody>
      </table>
    </div>
  </div>

  <div class="mt-4 flex items-center justify-between text-xs text-zinc-500">
    <span>Source: <span id="dataSource" class="text-emerald-400">--</span></span>
    <span>Last updated: <span id="lastUpdate">--</span></span>
  </div>
</section>

<script>
const SYMBOL_CONFIG = {
  NIFTY: { gap: 50, base: 24500 },
  BANKNIFTY: { gap: 100, base: 52500 },
  FINNIFTY: { gap: 50, base: 24250 }
};

let currentSymbol = 'NIFTY';
let chainData = [];
let prevChain = {};

function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
setInterval(updateClock, 1000);
updateClock();

function switchSymbol(symbol) {
  currentSymbol = symbol;
  document.querySelectorAll('[id^="tab-"]').forEach(btn => {
    btn.className = 'px-4 py-2 rounded-lg text-sm font-bold bg-zinc-900 text-zinc-300 hover:bg-zinc-800';
  });
  const active = document.getElementById('tab-' + symbol);
  if (active) active.className = 'px-4 py-2 rounded-lg text-sm font-bold bg-emerald-500 text-black';
  document.getElementById('symbolName').textContent = symbol;
  loadChain();
}

function formatNum(n) {
  if (!isFinite(n)) return '--';
  if (Math.abs(n) >= 100000) return (n/1000).toFixed(1) + 'K';
  if (Math.abs(n) >= 1000) return (n/1000).toFixed(1) + 'K';
  return Math.round(n).toString();
}

function pctClass(p) {
  if (p > 0) return 'up';
  if (p < 0) return 'down';
  return 'text-zinc-500';
}

async function loadChain() {
  try {
    const res = await fetch('/api/option-chain/' + currentSymbol);
    const data = await res.json();
    
    if (data.chain && data.chain.length > 0) {
      const spot = data.spot;
      const atm = data.atmStrike;
      const gap = SYMBOL_CONFIG[currentSymbol].gap;
      
      document.getElementById('spotPrice').textContent = '₹' + spot.toFixed(2);
      document.getElementById('atmStrike').textContent = atm;
      const isDemo = data.source === 'demo' || data.source === 'synthetic';
      document.getElementById('dataSource').textContent = isDemo ? 'Demo data (simulated)' : 'Live';
      
      const badge = document.getElementById('dataBadge');
      if (isDemo) {
        badge.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-yellow-500/10 border border-yellow-500/30';
        badge.innerHTML = '<span class="w-1.5 h-1.5 bg-yellow-400 rounded-full pulse"></span><span class="text-yellow-400 text-xs font-bold">DEMO</span>';
      } else {
        badge.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/30';
        badge.innerHTML = '<span class="w-1.5 h-1.5 bg-emerald-400 rounded-full pulse"></span><span class="text-emerald-400 text-xs font-bold">LIVE</span>';
      }
      
      const ceOi = data.chain.filter(o => o.type === 'CE').reduce((s, o) => s + (o.oi || 0), 0);
      const peOi = data.chain.filter(o => o.type === 'PE').reduce((s, o) => s + (o.oi || 0), 0);
      const pcr = ceOi > 0 ? (peOi / ceOi).toFixed(2) : '--';
      document.getElementById('pcrValue').textContent = pcr;
      
      let maxOiStrike = atm, maxOi = 0;
      data.chain.forEach(o => {
        if ((o.oi || 0) > maxOi) { maxOi = o.oi || 0; maxOiStrike = o.strike; }
      });
      document.getElementById('maxPain').textContent = maxOiStrike;
      
      const atmCE = data.chain.find(o => o.strike === atm && o.type === 'CE');
      document.getElementById('atmIV').textContent = 'IV: ' + (atmCE ? atmCE.iv.toFixed(1) : '--') + '%';
      
      const grouped = {};
      data.chain.forEach(o => {
        if (!grouped[o.strike]) grouped[o.strike] = { CE: null, PE: null };
        grouped[o.strike][o.type] = o;
      });
      
      const strikes = Object.keys(grouped).map(Number).sort((a, b) => b - a);
      const maxOiForScale = Math.max(...data.chain.map(o => o.oi || 0), 1);
      
      let html = '';
      strikes.forEach(strike => {
        const ce = grouped[strike].CE;
        const pe = grouped[strike].PE;
        const isATM = strike === atm;
        
        const prev = prevChain[strike];
        const ceChg = prev && prev.CE ? ((ce.ltp - prev.CE.ltp) / prev.CE.ltp * 100) : 0;
        const peChg = prev && prev.PE ? ((pe.ltp - prev.PE.ltp) / prev.PE.ltp * 100) : 0;
        
        html += '<tr class="border-t border-zinc-800/50 ' + (isATM ? 'bg-emerald-500/10' : 'hover:bg-zinc-900/50') + '">' +
          '<td class="p-2 text-right"><div class="flex flex-col items-end gap-1"><span class="text-emerald-400 font-semibold">' + formatNum(ce.oi) + '</span><div class="w-16 bg-zinc-800 rounded-full overflow-hidden"><div class="oi-bar bg-emerald-500" style="width:' + ((ce.oi/maxOiForScale)*100) + '%"></div></div></div></td>' +
          '<td class="p-2 text-right text-xs ' + pctClass(ceChg) + '">' + (ceChg ? (ceChg > 0 ? '+' : '') + ceChg.toFixed(1) + '%' : '--') + '</td>' +
          '<td class="p-2 text-center font-bold text-emerald-400">₹' + ce.ltp.toFixed(2) + '</td>' +
          '<td class="p-2 text-center font-black text-sm ' + (isATM ? 'bg-zinc-800 text-white' : 'bg-zinc-900 text-zinc-300') + '">' + strike + '</td>' +
          '<td class="p-2 text-center font-bold text-rose-400">₹' + pe.ltp.toFixed(2) + '</td>' +
          '<td class="p-2 text-left text-xs ' + pctClass(peChg) + '">' + (peChg ? (peChg > 0 ? '+' : '') + peChg.toFixed(1) + '%' : '--') + '</td>' +
          '<td class="p-2 text-left"><div class="flex flex-col gap-1"><span class="text-rose-400 font-semibold">' + formatNum(pe.oi) + '</span><div class="w-16 bg-zinc-800 rounded-full overflow-hidden"><div class="oi-bar bg-rose-500" style="width:' + ((pe.oi/maxOiForScale)*100) + '%"></div></div></div></td>' +
        '</tr>';
      });
      
      document.getElementById('chainBody').innerHTML = html;
      document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('en-IN');
      
      prevChain = {};
      data.chain.forEach(o => { prevChain[o.strike] = { ...grouped[o.strike] }; });
    }
  } catch (e) {
    console.error('Failed to load chain:', e);
  }
}

async function loadIndices() {
  try {
    const res = await fetch('/api/indices');
    const data = await res.json();
    const ticker = document.getElementById('ticker');
    const html = data.map(i => {
      const c = i.change >= 0 ? 'text-emerald-400' : 'text-red-400';
      const a = i.change >= 0 ? '▲' : '▼';
      const sign = i.change >= 0 ? '+' : '';
      return '<span class="text-zinc-400">' + i.name + ' <span class="' + c + ' font-bold">' + i.last.toFixed(2) + ' ' + a + ' ' + sign + Math.abs(i.percentChange).toFixed(2) + '%</span></span>';
    }).join('');
    ticker.innerHTML = html + html;
  } catch (e) {}
}

loadChain();
loadIndices();
setInterval(loadChain, 5000);
setInterval(loadIndices, 5000);
</script>
</body>
</html>
